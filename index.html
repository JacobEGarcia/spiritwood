<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIRITWOOD</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#b8d5c2;color:#173d32;font:13px ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;padding:22px;pointer-events:none}.title{font:900 clamp(31px,6vw,68px)/.8 serif;letter-spacing:-.06em;color:#174a3b;text-shadow:2px 2px #d8e8c4}.sub{margin-top:12px}.quest{position:absolute;right:22px;top:22px;text-align:right;background:#e8efd0aa;padding:12px;border-radius:10px}.quest b{color:#c85f3d}.stamina{position:absolute;left:22px;bottom:22px;width:230px}.bar{height:10px;border:2px solid #174a3b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#e7c75c;width:100%}.help{position:absolute;right:22px;bottom:22px;text-align:right}.msg{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:900 24px serif;color:#fff;text-shadow:0 2px 5px #173d32;opacity:0;transition:.4s}.msg.on{opacity:1}.start{position:fixed;inset:0;background:#d9e5c4e8;display:grid;place-items:center;text-align:center;z-index:3}.start.off{display:none}.start button{padding:13px 23px;border:2px solid #174a3b;background:transparent;color:#174a3b;font:inherit;font-weight:bold;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="title">SPIRITWOOD</div><div class="sub">THE VALE REMEMBERS</div><div class="quest">SPIRIT ORBS <b id="orbs">0 / 8</b><br>SHRINES CLEANSED <b id="shrines">0 / 3</b></div><div class="stamina">GLIDE STAMINA<div class="bar"><i id="stam"></i></div></div><div class="help">WASD / ARROWS MOVE · SPACE GLIDE<br>WALK INTO ORBS & SHRINES</div><div class="msg" id="msg"></div></div><div class="start" id="start"><div><div class="title">SPIRITWOOD</div><p>Three shrines have gone quiet. Follow the kodama.<br>Gather spirit light and return the vale to itself.</p><button id="go">ENTER THE VALE</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);let p={x:innerWidth/2,y:innerHeight/2,st:100},keys={},running=false,cam={x:0,y:0},orbs=[],shrines=[],kodama=[];for(let i=0;i<8;i++)orbs.push({x:(i%4)*430-500,y:Math.floor(i/4)*500-220,taken:false});for(let i=0;i<3;i++)shrines.push({x:(i-1)*620,y:i%2?380:-480,clean:false});for(let i=0;i<12;i++)kodama.push({x:Math.random()*1500-750,y:Math.random()*1200-600,a:Math.random()*6});function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;$('#go').onclick=()=>{$('#start').classList.add('off');running=true};function message(s){$('#msg').textContent=s;$('#msg').classList.add('on');setTimeout(()=>$('#msg').classList.remove('on'),1300)}function tree(x,y,s=1){g.fillStyle='#385c43';g.fillRect(x-7*s,y-30*s,14*s,45*s);g.fillStyle='#4e8b5b';g.beginPath();g.arc(x,y-45*s,27*s,0,7);g.arc(x-20*s,y-30*s,22*s,0,7);g.arc(x+18*s,y-28*s,25*s,0,7);g.fill()}function draw(t){let w=innerWidth,h=innerHeight;if(running){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),glide=keys[' '];let sp=glide&&p.st>0?5.5:3;p.x+=dx*sp;p.y+=dy*sp;if(glide&&Math.hypot(dx,dy))p.st=Math.max(0,p.st-.45);else p.st=Math.min(100,p.st+.18)}cam.x+=(p.x-cam.x-w/2)*.07;cam.y+=(p.y-cam.y-h/2)*.07;let grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#9ccdb9');grad.addColorStop(1,'#d7dfa7');g.fillStyle=grad;g.fillRect(0,0,w,h);g.save();g.translate(-cam.x,-cam.y);g.fillStyle='#accd8c';g.fillRect(-2000,-1600,4000,3200);g.strokeStyle='#8eb278';g.lineWidth=2;for(let i=-30;i<30;i++){g.beginPath();g.moveTo(i*90,-1600);g.quadraticCurveTo(i*90+130,0,i*90,1600);g.stroke()}for(let i=0;i<65;i++)tree((i*311)%2600-1300,(i*173)%2100-1050,.7+(i%4)*.15);shrines.forEach(s=>{let sx=s.x,sy=s.y;g.fillStyle=s.clean?'#eee6a4':'#52665f';g.fillRect(sx-55,sy-10,110,20);g.fillRect(sx-37,sy-75,15,70);g.fillRect(sx+22,sy-75,15,70);g.fillRect(sx-48,sy-80,96,14);g.strokeStyle=s.clean?'#fffbd0':'#354942';g.lineWidth=5;g.beginPath();g.arc(sx,sy-35,60+Math.sin(t*.003)*5,0,7);g.stroke();if(!s.clean&&Math.hypot(p.x-sx,p.y-sy)<70){s.clean=true;message('SHRINE AWAKENED');$('#shrines').textContent=shrines.filter(q=>q.clean).length+' / 3'}});orbs.forEach((o,i)=>{if(o.taken)return;g.fillStyle='#fff9a3';g.shadowColor='#fff5a0';g.shadowBlur=20;g.beginPath();g.arc(o.x,o.y+Math.sin(t*.003+i)*10,9,0,7);g.fill();g.shadowBlur=0;if(Math.hypot(p.x-o.x,p.y-o.y)<35){o.taken=true;message('SPIRIT LIGHT FOUND');$('#orbs').textContent=orbs.filter(q=>q.taken).length+' / 8'}});kodama.forEach(k=>{let yy=k.y+Math.sin(t*.002+k.a)*5;g.fillStyle='#e9f2d3';g.beginPath();g.arc(k.x,yy-15,8,0,7);g.fill();g.fillRect(k.x-5,yy-8,10,16);g.fillStyle='#203c32';g.fillRect(k.x-3,yy-17,2,2);g.fillRect(k.x+3,yy-17,2,2)});g.translate(p.x,p.y);g.fillStyle='#d45c42';g.fillRect(-7,-20,14,25);g.fillStyle='#f3deb6';g.beginPath();g.arc(0,-25,8,0,7);g.fill();if(keys[' ']&&p.st>0){g.fillStyle='#f0e7c7cc';g.beginPath();g.moveTo(-8,-17);g.quadraticCurveTo(-50,-45,-55,8);g.lineTo(-5,2);g.fill();g.beginPath();g.moveTo(8,-17);g.quadraticCurveTo(50,-45,55,8);g.lineTo(5,2);g.fill()}g.restore();$('#stam').style.width=p.st+'%';requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
